name: Release

on:
  push:
    tags: ["v*"]

# Triggered directly by the tag push (not gated on the main CI workflow
# via workflow_run -- unverified whether this Gitea Actions version
# supports that trigger at all, and it's not needed here anyway: the
# same push that creates the tag also pushes the branch commit, which
# triggers .gitea/workflows/ci.yml's full check suite independently, so
# this workflow doesn't need to re-verify the build -- it only needs to
# build the release .deb files.
#
# This does NOT create a Gitea Release automatically (unlike the GitHub
# file, which does). The v0.1.0 tag push hit a real, infra-specific
# problem: the job container can reach the public internet fine (it
# installs the Raspberry Pi apt archive over HTTPS a few steps below)
# but cannot resolve/reach gitea.h.leenx.nz itself --
#   curl: (7) Failed to connect to gitea.h.leenx.nz port 443 ... Could
#   not connect to server
# -- almost certainly because that hostname only resolves via internal
# LAN DNS, which the job container's network namespace doesn't have
# access to even though it can reach the wider internet. That's a
# runner/container-network configuration question on the host running
# act_runner, not something fixable from workflow YAML alone.
#
# So instead: build the .deb files and upload them as a normal
# workflow artifact (downloadable from the Actions run), along with the
# generated release notes. Pick the release from the already-pushed tag
# in the Gitea web UI and attach the downloaded files by hand. If the
# container network gets fixed later, this can go back to calling the
# release/asset API the way .github/workflows/release.yml does.
jobs:
  release:
    runs-on: arm64
    container: debian:trixie
    steps:
      - name: Install Node.js and build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gnupg build-essential bc flex bison libssl-dev libelf-dev
          curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
          apt-get install -y -qq nodejs git
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify dkms.conf version matches the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          conf_version=$(grep -m1 '^PACKAGE_VERSION=' dkms.conf | cut -d'"' -f2)
          if [ "$conf_version" != "$version" ]; then
            echo "::error::tag $tag doesn't match dkms.conf PACKAGE_VERSION=$conf_version" >&2
            exit 1
          fi
      - name: Build source .deb
        run: |
          mkdir -p out
          ./scripts/build-source-deb.sh out
      # sinput-common plus one sinput-modules-<kernel> .deb for the
      # archive's current rpi-v8 kernel. For more kernels on an existing
      # release later, see the "Extra kernels" section of RELEASE.md.
      - name: Build binary .debs
        run: ./scripts/build-rpi-debs.sh -o out
      - name: Generate release notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev_tag" ]; then
            git log --pretty=format:'* %s (%h)' "${prev_tag}..HEAD" > out/release-notes.md
          else
            git log --pretty=format:'* %s (%h)' HEAD > out/release-notes.md
          fi
      - uses: actions/upload-artifact@v3.2.2
        with:
          name: release-${{ github.ref_name }}
          path: out/*
