# Mirrors .gitea/workflows/ci.yml and .github/workflows/ci.yml (same
# jobs, same underlying scripts/commands) but isn't the same file: none
# of GitHub/Gitea Actions' YAML syntax carries over to GitLab CI, which
# uses a different schema entirely (stages/script/rules vs jobs/steps/
# uses). Two structural upsides worth knowing about while reading this:
#
# - No checkout step, and no Node.js-in-container workaround needed:
#   gitlab-runner clones the repo itself before running `script:`,
#   unlike actions/checkout which is a JavaScript action that has to run
#   inside the job's own container.
# - No upload-artifact action either: `artifacts:` is a native
#   gitlab-runner feature, so there's no v3-vs-v4 protocol question like
#   there was on Gitea/GitHub.
#
# Assumes gitlab.com shared runners. If this is self-hosted GitLab
# instead, register runner(s) and adjust/remove the `tags:` below to
# match what's actually configured.

stages:
  - test
  - build

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

protocol-check:
  stage: test
  image: debian:bookworm
  script:
    - apt-get update -qq && apt-get install -y -qq build-essential
    - make check

shellcheck:
  stage: test
  image: koalaman/shellcheck-alpine:stable
  script:
    - shellcheck scripts/*.sh

# Linux kernel style checker. LINUX_VERSION_CODE/CONSTANT_COMPARISON are
# ignored: checkpatch expects in-tree code that targets one kernel
# version, but this is an out-of-tree DKMS driver that has to compile
# against a range of kernel versions, so the LINUX_VERSION_CODE guard in
# src/sinput.c is intentional. tests/ is host-side code, not kernel
# code, so it is not checked here.
checkpatch:
  stage: test
  image: debian:bookworm
  script:
    - apt-get update -qq && apt-get install -y -qq perl wget
    - mkdir -p /tmp/checkpatch
    - wget -q -O /tmp/checkpatch/checkpatch.pl https://raw.githubusercontent.com/torvalds/linux/master/scripts/checkpatch.pl
    - wget -q -O /tmp/checkpatch/spelling.txt https://raw.githubusercontent.com/torvalds/linux/master/scripts/spelling.txt
    - wget -q -O /tmp/checkpatch/const_structs.checkpatch https://raw.githubusercontent.com/torvalds/linux/master/scripts/const_structs.checkpatch
    - |
      perl /tmp/checkpatch/checkpatch.pl --no-tree --no-signoff \
        --ignore=LINUX_VERSION_CODE,CONSTANT_COMPARISON \
        --file src/sinput.c src/sinput_protocol.h

# Compile the module against real kernel headers for a couple of
# released kernel versions. This is a compile check only: it catches
# build breaks, not runtime/behavioural bugs, since no SInput hardware
# is available in CI.
kernel-build:
  stage: test
  image: debian:$RELEASE
  parallel:
    matrix:
      - RELEASE: [bookworm, trixie]
  script:
    - apt-get update -qq
    - apt-get install -y -qq build-essential bc flex bison libssl-dev libelf-dev sparse
        linux-headers-$(dpkg --print-architecture)
    - kdir=/lib/modules/$(ls /lib/modules)/build
    - make KDIR=$kdir
    - make KDIR=$kdir clean
    - make KDIR=$kdir W=1
    - make KDIR=$kdir clean
    - make KDIR=$kdir C=2 CF="-D__CHECK_ENDIAN__"

# Source DKMS package: ships source + dkms.conf under /usr/src and a
# postinst that builds/installs via dkms itself. This is a genuine
# regression test, not just an artifact build -- it does a real
# `dpkg -i` (which drives dkms add/build/install) and `dpkg -r` (which
# drives dkms remove).
#
# The symlink step below only exists to make a container's reported
# `uname -r` match the generic kernel headers package installed here,
# so dkms's own default kernel-targeting logic has something to find. A
# real target machine needs no such trick: it's already running the
# kernel its own headers match.
dkms-source-deb:
  stage: build
  image: debian:bookworm
  script:
    - apt-get update -qq
    - apt-get install -y -qq dkms build-essential bc flex bison libssl-dev libelf-dev
        linux-headers-$(dpkg --print-architecture)
    - mkdir -p out
    - ./scripts/build-source-deb.sh out
    - kver=$(ls /lib/modules)
    - ln -sfn "/lib/modules/${kver}" "/lib/modules/$(uname -r)" 2>/dev/null || true
    - dpkg -i out/*.deb
    - test -e "/lib/modules/${kver}/updates/dkms/sinput.ko"
    - version="$(grep '^PACKAGE_VERSION=' dkms.conf | cut -d'"' -f2)"
    - dkms status | grep -q "sinput/${version}.*installed"
    - dpkg -r sinput-dkms
    - '! dkms status | grep -q "^sinput/"'
  artifacts:
    paths:
      - out/*.deb

# Precompiled binary package for a real Raspberry Pi 3 running 64-bit
# Raspberry Pi OS (trixie). Unlike kernel-build above, this targets
# Raspberry Pi's own kernel headers (rpi-v8 variant, shared by RPi3 and
# RPi4, NOT RPi5's rpi-2712 variant) rather than generic Debian ones,
# since the module's vermagic must match the real device's exact kernel
# build. See docs/rpi-hil.md for why this is more involved than a
# normal apt-get install, the bookworm-vs-trixie difference, and how to
# pin an exact kernel version instead of always tracking "current".
#
# `tags:` below is an UNVERIFIED GUESS at GitLab.com's shared arm64
# runner tag, and may be tier-gated or renamed -- check
# https://docs.gitlab.com/ci/runners/hosted_runners/linux/ for the
# current tag before relying on this. linux-headers-rpi-v8 only exists
# for arm64 (Raspberry Pi doesn't publish it for amd64), so this has to
# land on an arm64 host regardless of which platform runs it -- if
# that tag doesn't resolve, register a self-hosted arm64 runner (the
# same RPi4/5 already running the Gitea act_runner could double as one)
# and point `tags:` at that instead.
rpi3-binary-deb:
  stage: build
  image: debian:trixie
  tags:
    - saas-linux-small-arm64
  script:
    - apt-get update -qq
    - apt-get install -y -qq curl build-essential bc flex bison libssl-dev libelf-dev
    - |
      curl -fsSL \
        https://archive.raspberrypi.com/debian/pool/main/r/raspberrypi-archive-keyring/raspberrypi-archive-keyring_2025.1+rpt1_all.deb \
        -o /tmp/keyring.deb
    - dpkg -i /tmp/keyring.deb
    - echo 'deb http://archive.raspberrypi.com/debian/ trixie main' > /etc/apt/sources.list.d/raspi.list
    - apt-get update -qq
    - apt-get install -y -qq linux-headers-rpi-v8
    - kdir=$(ls -d /lib/modules/*/build | head -1)
    - mkdir -p out
    - ./scripts/build-binary-deb.sh "$kdir" out
  artifacts:
    paths:
      - out/*.deb
