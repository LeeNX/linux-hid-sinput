PACKAGE_NAME="sinput"
PACKAGE_VERSION="0.1.1"
BUILT_MODULE_NAME[0]="sinput"
# The Makefile builds src/sinput.o (obj-m += src/sinput.o), so the .ko lands
# in src/, not at the build directory root where dkms looks by default.
BUILT_MODULE_LOCATION[0]="src"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# Must use $kernel_source_dir, not a naive /lib/modules/$kernelver/build:
# dkms resolves the former correctly even when building for a kernel other
# than the one currently running (e.g. via --kernelsourcedir, or a
# pre-reboot build after a kernel upgrade); the Makefile's own KDIR default
# only knows about `uname -r`, which is wrong in exactly that case.
MAKE[0]="make KDIR=${kernel_source_dir} KERNELRELEASE=${kernelver}"
CLEAN="make clean"
