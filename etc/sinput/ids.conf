# Extra VID:PID pairs the sinput driver should claim, one per line, in hex
# (with or without "0x"), e.g.:
#
#   2e8a:1a01
#   1209:1a01   # pid.codes shared VID -- see README.md "Adding your own VID/PID"
#
# The udev rule installed at /usr/lib/udev/rules.d/99-sinput.rules reads
# this file (via /usr/lib/sinput/sinput-claim-id.sh) every time a matching
# HID device is plugged in, and rebinds it from hid-generic to sinput. No
# module rebuild or reboot needed -- just unplug/replug (or re-pair, for
# Bluetooth) the device after editing this file.
#
# The generic SInput testing VID/PID (2E8A:10C6) does not need an entry
# here -- it is already built into the driver.
